<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obstacle log</title>
<meta name="theme-color" content="#0f2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obstacle log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ink:#0f2233;--paper:#eef2f4;--card:#fff;--line:#c9d3d9;--mute:#5b6b77;--orange:#d9480f;--ok:#1b7f4b;--warn:#b45309;--bad:#b42318}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;margin-top:calc(-1*env(safe-area-inset-top))}
header h1{margin:0;font-size:20px;font-weight:650}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{margin:0 0 10px;font-size:16px;font-weight:650}
.coords{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.25}
.coords span{display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;background:var(--mute)}
.chip.ok{background:var(--ok)}.chip.warn{background:var(--warn)}.chip.bad{background:var(--bad)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:650;border:0;border-radius:10px;padding:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2f80ed;outline-offset:2px}
.save{width:100%;margin-top:14px;background:var(--orange);color:#fff;font-size:18px}
.save:disabled{background:#9aa7b0}
.alt{background:#e3e9ed;color:var(--ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.nm{font-weight:650}
.sm{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;word-break:break-word}
.del{background:none;color:var(--bad);padding:6px 8px;font-weight:600}
.empty{color:var(--mute);margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>Obstacle log</h1></header>
<main>
  <section aria-live="polite">
    <h2>Current position</h2>
    <div class="coords"><span id="lat">Waiting for GPS…</span><span id="lon"></span></div>
    <div class="meta"><span id="alt"></span><span id="age"></span></div>
    <span class="chip" id="chip">No fix</span>
  </section>

  <section>
    <h2>New record</h2>
    <label for="name">Object name</label>
    <input id="name" autocomplete="off" placeholder="e.g. Mast near threshold 04">
    <div class="row">
      <div><label for="type">Type</label>
        <select id="type"><option>Tree</option><option>Building</option><option>Tower / mast</option><option>Pole / line</option><option>Chimney</option><option>Terrain</option><option>Other</option></select></div>
      <div><label for="hagl">Height above ground (m)</label>
        <input id="hagl" type="number" inputmode="decimal" step="0.1" placeholder="optional"></div>
    </div>
    <label for="notes">Notes</label>
    <textarea id="notes" rows="2"></textarea>
    <label for="lim">Warn if accuracy is worse than (m)</label>
    <input id="lim" type="number" inputmode="decimal" min="1" value="10">
    <button class="save" id="save" disabled>Save position</button>
  </section>

  <section>
    <h2>Records (<span id="count">0</span>)</h2>
    <div class="tools">
      <button class="alt" id="csv">Export CSV</button>
      <button class="alt" id="gj">Export GeoJSON</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">No records yet. Wait for a GPS fix, then tap Save position.</p>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = id => document.getElementById(id);
let fix = null;

/* ---------- storage (IndexedDB) ---------- */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('obstacle-log', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('rec', { keyPath: 'id', autoIncrement: true });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function tx(mode, fn) {
  const db = await DB;
  return new Promise((res, rej) => {
    const t = db.transaction('rec', mode);
    const rq = fn(t.objectStore('rec'));
    t.oncomplete = () => res(rq && rq.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = () => tx('readonly', s => s.getAll());

/* ---------- GPS ---------- */
function limit() { return +$('lim').value || 10; }
function render() {
  if (!fix) return;
  $('lat').textContent = 'Lat ' + fix.lat.toFixed(7);
  $('lon').textContent = 'Lon ' + fix.lon.toFixed(7);
  const a = fix.alt == null ? 'no altitude' : 'Alt ' + fix.alt.toFixed(1) + ' m' + (fix.altAcc != null ? ' ±' + fix.altAcc.toFixed(0) : '') + ' (phone, unverified)';
  $('alt').textContent = a;
  const c = $('chip'), lim = limit();
  c.textContent = 'Horizontal ±' + fix.acc.toFixed(1) + ' m';
  c.className = 'chip ' + (fix.acc <= lim ? 'ok' : fix.acc <= lim * 2 ? 'warn' : 'bad');
  $('save').disabled = false;
}
setInterval(() => {
  if (fix) $('age').textContent = 'Fix ' + Math.round((Date.now() - fix.t) / 1000) + ' s old';
}, 1000);
function startGps() {
  if (!navigator.geolocation) { $('lat').textContent = 'GPS not available in this browser'; return; }
  navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    fix = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, altAcc: c.altitudeAccuracy, t: p.timestamp };
    render();
  }, e => {
    $('lat').textContent = e.code === 1 ? 'Location permission denied. Allow location for this site in iPhone Settings.' : 'GPS error: ' + e.message;
    $('chip').textContent = 'No fix'; $('chip').className = 'chip bad';
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

/* ---------- records ---------- */
async function refresh() {
  const rows = (await getAll()).sort((a, b) => b.id - a.id);
  $('count').textContent = rows.length;
  $('empty').style.display = rows.length ? 'none' : '';
  const ul = $('list'); ul.textContent = '';
  rows.forEach(r => {
    const li = document.createElement('li');
    const d = document.createElement('div');
    const n = document.createElement('div'); n.className = 'nm'; n.textContent = r.name + ' · ' + r.type;
    const s = document.createElement('div'); s.className = 'sm';
    s.textContent = r.lat.toFixed(7) + ', ' + r.lon.toFixed(7) + ' · ±' + r.hAcc.toFixed(1) + ' m' + (r.haglM != null ? ' · ' + r.haglM + ' m AGL' : '') + ' · ' + r.time.slice(0, 16).replace('T', ' ') + ' UTC';
    d.append(n, s);
    const b = document.createElement('button'); b.className = 'del'; b.textContent = 'Delete';
    b.onclick = async () => { if (confirm('Delete "' + r.name + '"?')) { await tx('readwrite', st => st.delete(r.id)); refresh(); } };
    li.append(d, b); ul.append(li);
  });
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }

$('save').onclick = async () => {
  if (!fix) return;
  if (fix.acc > limit() && !confirm('Accuracy is ±' + fix.acc.toFixed(0) + ' m, worse than your ' + limit() + ' m limit. Save anyway?')) return;
  const n = (await getAll()).length + 1;
  const h = $('hagl').value;
  await tx('readwrite', s => s.add({
    name: $('name').value.trim() || 'Object ' + n, type: $('type').value,
    lat: fix.lat, lon: fix.lon, hAcc: fix.acc, alt: fix.alt, altAcc: fix.altAcc,
    haglM: h === '' ? null : +h, notes: $('notes').value.trim(),
    time: new Date(fix.t).toISOString(), source: 'phone-gps'
  }));
  $('name').value = ''; $('hagl').value = ''; $('notes').value = '';
  toast('Saved'); refresh();
};

/* ---------- export ---------- */
async function out(name, mime, text) {
  const f = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$('csv').onclick = async () => {
  const rows = await getAll();
  if (!rows.length) return toast('No records to export');
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = ['id', 'name', 'type', 'latitude_wgs84', 'longitude_wgs84', 'h_accuracy_m', 'altitude_m_phone_unverified', 'alt_accuracy_m', 'height_agl_m', 'notes', 'time_utc', 'source'];
  const lines = rows.map(r => [r.id, r.name, r.type, r.lat, r.lon, r.hAcc, r.alt, r.altAcc, r.haglM, r.notes, r.time, r.source].map(q).join(','));
  out('obstacles-' + stamp() + '.csv', 'text/csv', [head.join(','), ...lines].join('\n'));
};
$('gj').onclick = async () => {
  const rows = await getAll();
  if (!rows.length) return toast('No records to export');
  const fc = { type: 'FeatureCollection', features: rows.map(r => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [r.lon, r.lat].concat(r.alt != null ? [r.alt] : []) },
    properties: { id: r.id, name: r.name, type: r.type, h_accuracy_m: r.hAcc, alt_accuracy_m: r.altAcc, height_agl_m: r.haglM, notes: r.notes, time_utc: r.time, source: r.source }
  })) };
  out('obstacles-' + stamp() + '.geojson', 'application/json', JSON.stringify(fc, null, 2));
};

/* ---------- setup ---------- */
try { const l = localStorage.getItem('lim'); if (l) $('lim').value = l; } catch (e) {}
$('lim').onchange = () => { try { localStorage.setItem('lim', $('lim').value); } catch (e) {} render(); };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
refresh(); startGps();
</script>
</body>
</html>
